<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07050B">
  <meta name="description" content="Estúdio — agente de código da NEXA">
  <title>Estúdio | NEXA</title>
  <link rel="stylesheet" href="style.css?v=19">
  <link rel="stylesheet" href="studio.css?v=7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>

<body class="studio-body">

  <main class="studio-page" role="main">

    <header class="studio-topbar">
      <a class="studio-back" href="/" title="Voltar para a NEXA" aria-label="Voltar para a NEXA">
        <span aria-hidden="true">‹</span>
        <span class="studio-back-text">NEXA</span>
      </a>
      <div class="studio-title">
        <strong>Estúdio</strong>
        <span id="studioStatus">Verificando sessão…</span>
      </div>
      <button type="button" id="filesToggle" class="studio-files-toggle" aria-label="Arquivos" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <span>Arquivos</span>
      </button>
    </header>

    <section class="studio-viewer" aria-label="Visualizador de arquivos">
      <div class="studio-viewer-tabs" id="viewerTabs" role="tablist" aria-label="Arquivos abertos"></div>
      <div class="studio-viewer-panels" id="viewerPanels"></div>
      <div class="studio-viewer-empty" id="viewerEmpty" hidden>
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <p>Nenhum arquivo aberto</p>
        <span class="studio-viewer-hint">Clique em um arquivo à esquerda para abri-lo</span>
      </div>
    </section>

  </main>

  <aside class="studio-files" id="filesPane" hidden aria-label="Painel de arquivos">
    <div class="studio-files-resize" id="filesResize" title="Arraste para redimensionar" aria-hidden="true"></div>
    <header>
      <div class="studio-files-header">
        <strong>Arquivos</strong>
        <span class="studio-files-count" id="filesCount" aria-live="polite">0</span>
      </div>
      <div class="studio-files-actions">
        <button type="button" id="filesRefresh" title="Atualizar" aria-label="Atualizar lista">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        </button>
        <button type="button" id="filesClose" title="Fechar" aria-label="Fechar painel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </header>
    <div class="studio-files-search" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="search" id="filesSearch" placeholder="Filtrar arquivos…" aria-label="Filtrar arquivos">
    </div>
    <ul id="fileTree" class="studio-file-tree" role="tree" aria-label="Árvore de arquivos"></ul>
    <div class="studio-empty" id="fileTreeEmpty" hidden>Nada por aqui ainda. Peça alguma coisa!</div>
  </aside>

  <aside class="studio-chat-pane" id="chatPane" aria-label="Chat do agente">
    <div class="studio-chat-resize" id="chatResize" title="Arraste para redimensionar" aria-hidden="true"></div>
    <section class="studio-chat" id="chat" aria-live="polite" aria-label="Conversa com o agente de código"></section>
    <form class="studio-composer" id="composer">
      <div class="studio-composer-bar">
        <button type="button" class="studio-composer-btn" id="btnStop" title="Parar geração" aria-label="Parar geração" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Peça algo: um site, um script, um jogo…" aria-label="Mensagem para o agente de código"></textarea>
        <button type="submit" aria-label="Enviar" title="Enviar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </div>
      <div class="studio-suggestions" id="suggestions" hidden>
        <button type="button" class="studio-suggestion" data-text="Cria um jogo da cobrinha em Python">Jogo da cobrinha (Python)</button>
        <button type="button" class="studio-suggestion" data-text="Cria um site simples com HTML, CSS e JS">Site simples (HTML/CSS/JS)</button>
        <button type="button" class="studio-suggestion" data-text="Escreve um script que organiza arquivos por extensão">Organizador de arquivos</button>
        <button type="button" class="studio-suggestion" data-text="Faz um componente React de lista de tarefas">Componente React (Todo)</button>
      </div>
    </form>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="studio.js?v=5"></script>
</body>
</html>
