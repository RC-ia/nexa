<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07050B"
  >

  <meta
    name="description"
    content="NEXA — assistente pessoal inteligente"
  >

  <title>NEXA</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="ambient ambient-three"></div>

  <main class="app">

    <header class="topbar">

      <div class="brand">

        <div class="orb">
          <div class="orb-inner"></div>
        </div>

        <div class="brand-info">
          <h1>NEXA</h1>
          <span>Assistente pessoal</span>
        </div>

      </div>

      <div class="topbar-actions">

        <span class="status">
          <i></i>
          Online
        </span>

        <button
          type="button"
          id="newChatButton"
          class="new-chat-button"
        >
          Nova conversa
        </button>

      </div>

    </header>


    <section class="hero">

      <div class="core">

        <div class="core-aura"></div>
        <div class="core-glow"></div>

        <div class="core-ring ring-one"></div>
        <div class="core-ring ring-two"></div>
        <div class="core-ring ring-three"></div>

        <div class="particle particle-one"></div>
        <div class="particle particle-two"></div>
        <div class="particle particle-three"></div>
        <div class="particle particle-four"></div>
        <div class="particle particle-five"></div>
        <div class="particle particle-six"></div>
        <div class="particle particle-seven"></div>
        <div class="particle particle-eight"></div>

        <div class="core-energy"></div>
        <div class="core-dot"></div>

      </div>

      <h2>
        Olá. Eu sou a NEXA.
      </h2>

      <p>
        Seu assistente pessoal está pronto para começar.
      </p>

    </section>


    <section
      class="chat"
      id="chat"
      aria-live="polite"
      aria-label="Conversa com a NEXA"
    >

      <div class="message nexa">

        <span class="label">
          NEXA
        </span>

        <p>
          E aí. Sou a NEXA. Já tô online — manda a boa.
        </p>

      </div>

    </section>


    <form
      class="composer"
      id="composer"
      autocomplete="off"
    >

      <input
        id="messageInput"
        type="text"
        placeholder="Digite uma mensagem..."
        autocomplete="off"
        aria-label="Mensagem"
      >

      <div class="reasoning-wrap" id="reasoningWrap">
        <button
          type="button"
          id="reasoningButton"
          class="reasoning-button"
          data-level="0"
          aria-label="Reforço de raciocínio"
          aria-haspopup="menu"
          aria-expanded="false"
          title="Reforço de raciocínio"
        >
          <span class="reasoning-icon" aria-hidden="true">⚡</span>
          <span class="reasoning-label" id="reasoningLabel">Nenhum</span>
          <span class="reasoning-meter" id="reasoningMeter" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </span>
          <span class="reasoning-caret" aria-hidden="true">▾</span>
        </button>

        <div
          class="reasoning-dropdown"
          id="reasoningDropdown"
          role="menu"
        >
          <button
            type="button"
            class="reasoning-item"
            data-reasoning="none"
            data-level="0"
            role="menuitemradio"
          >
            <span class="reasoning-item-main">
              <span class="reasoning-item-name">Nenhum</span>
              <span class="reasoning-item-hint">Direto, sem pensar muito</span>
            </span>
            <span class="reasoning-meter" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </span>
          </button>

          <button
            type="button"
            class="reasoning-item"
            data-reasoning="low"
            data-level="1"
            role="menuitemradio"
          >
            <span class="reasoning-item-main">
              <span class="reasoning-item-name">Baixo</span>
              <span class="reasoning-item-hint">Resposta rápida</span>
            </span>
            <span class="reasoning-meter" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </span>
          </button>

          <button
            type="button"
            class="reasoning-item"
            data-reasoning="medium"
            data-level="2"
            role="menuitemradio"
          >
            <span class="reasoning-item-main">
              <span class="reasoning-item-name">Médio</span>
              <span class="reasoning-item-hint">Equilíbrio entre velocidade e cuidado</span>
            </span>
            <span class="reasoning-meter" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </span>
          </button>

          <button
            type="button"
            class="reasoning-item"
            data-reasoning="high"
            data-level="3"
            role="menuitemradio"
          >
            <span class="reasoning-item-main">
              <span class="reasoning-item-name">Alto</span>
              <span class="reasoning-item-hint">Pensa bem antes de responder</span>
            </span>
            <span class="reasoning-meter" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </span>
          </button>

          <button
            type="button"
            class="reasoning-item"
            data-reasoning="xhigh"
            data-level="4"
            role="menuitemradio"
          >
            <span class="reasoning-item-main">
              <span class="reasoning-item-name">Máximo</span>
              <span class="reasoning-item-hint">Bem mais lento e detalhado</span>
            </span>
            <span class="reasoning-meter" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </span>
          </button>
        </div>
      </div>

      <button
        type="button"
        id="micButton"
        aria-label="Microfone"
        title="Falar"
      >
        ◉
      </button>

      <button
        type="submit"
        aria-label="Enviar"
        title="Enviar mensagem"
      >
        ➤
      </button>

    </form>


    <footer>
      NEXA v<span id="nexaVersion">0.01</span> • IA conectada via Cloudflare
    </footer>

  </main>

  <script src="script.js?v=4"></script>

</body>

</html>
